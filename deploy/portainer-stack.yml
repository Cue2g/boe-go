# Stack para Portainer (Stacks > Add stack > Web editor).
# Usa la imagen cue2g/boe:latest de Docker Hub (ver README, sección Portainer).
# Los valores ${...} se definen en "Environment variables" del stack.
services:
  sboe:
    image: cue2g/boe:latest
    container_name: sboe
    restart: unless-stopped
    ports:
      - "${SBOE_PORT:-8080}:8080"
    environment:
      SBOE_DB_PATH: /data/sboe.db
      SBOE_ADDR: ":8080"
      SBOE_BASE_URL: ${SBOE_BASE_URL:-http://localhost:8080}
      SBOE_COOKIE_SECURE: ${SBOE_COOKIE_SECURE:-0}
      SBOE_TZ: ${SBOE_TZ:-Europe/Madrid}
      SBOE_MIN_DELAY: ${SBOE_MIN_DELAY:-1s}
      SBOE_MAX_DELAY: ${SBOE_MAX_DELAY:-3s}
      SBOE_RESEND_API_KEY: ${SBOE_RESEND_API_KEY:-}
      SBOE_RESEND_FROM: ${SBOE_RESEND_FROM:-}
      SBOE_SMTP_HOST: ${SBOE_SMTP_HOST:-}
      SBOE_SMTP_PORT: ${SBOE_SMTP_PORT:-587}
      SBOE_SMTP_USER: ${SBOE_SMTP_USER:-}
      SBOE_SMTP_PASS: ${SBOE_SMTP_PASS:-}
      SBOE_SMTP_FROM: ${SBOE_SMTP_FROM:-}
    volumes:
      - sboe-data:/data

volumes:
  sboe-data:
    name: sboe-data
