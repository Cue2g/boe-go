{{define "content"}}
<h1>Mi cuenta</h1>
<div class="panel narrow">
  <p><strong>{{.User.Email}}</strong> <span class="badge">{{if .User.IsAdmin}}Administrador{{else}}Usuario{{end}}</span></p>
  <h2>Cambiar contraseña</h2>
  <form class="stack" method="post" action="/app/cuenta/password">
    {{template "csrf" .CSRF}}
    <div class="field"><label>Contraseña actual</label><input type="password" name="current" required autocomplete="current-password"></div>
    <div class="field"><label>Nueva contraseña (mín. 8 caracteres)</label><input type="password" name="new" required minlength="8" autocomplete="new-password"></div>
    <div class="field"><label>Repite la nueva contraseña</label><input type="password" name="confirm" required minlength="8" autocomplete="new-password"></div>
    <button type="submit">Cambiar contraseña</button>
  </form>
</div>
{{end}}
